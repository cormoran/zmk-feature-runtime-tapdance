# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      revision: main+custom-studio-protocol
      import:
        file: app/west.yml
      clone-depth: 1
    # Provides the `west zmk-renode-test` / `west zmk-ble-test` commands (the
    # Renode wired-split harness + platforms used by tests/renode, plus the
    # BabbleSim runner) and the shared `ble-studio-host` app +
    # `studio_requests.json` DSL for tests/ble.
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
