# Exercise runtime-tapdance settings RPC over Studio BLE with a connected split
# peripheral. Registration ordering puts runtime_tapdance at index 0 in this
# fixture; exact response payloads are checked in events.snapshot.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_RUNTIME_TAPDANCE=y
CONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
# Keep the mutable local-ID iterable writable in the native executable.
CONFIG_ZMK_RUNTIME_TAPDANCE_NATIVE_BLE_TEST=y
# Initialize the settings subsystem during Bluetooth startup, before ZMK
# registers the dynamic BLE profile handler (SETTINGS_NONE has no early init).
CONFIG_BT_SETTINGS=y
