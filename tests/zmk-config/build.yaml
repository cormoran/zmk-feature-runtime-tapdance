include:
  - artifact: runtime_tapdance_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: runtime_tapdance_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_RUNTIME_TAPDANCE=y -DCONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippet: studio-rpc-usb-uart

  - artifact: runtime_tapdance_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_RUNTIME_TAPDANCE=y

  # DUT for the web UI end-to-end test (see web/e2e/ and README.md's "Web UI
  # end-to-end testing"): the same real studio-rpc-usb-uart image as
  # runtime_tapdance_board_with_rpc -- one machine, so it boots and enumerates
  # USB fast -- but with Studio locking OFF. An emulator has no key to press
  # &studio_unlock with, and the web UI disables its controls while locked.
  - artifact: web_e2e
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_RUNTIME_TAPDANCE=y -DCONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippet: studio-rpc-usb-uart

  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_RUNTIME_TAPDANCE=y -DCONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256 -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  # Hardware-free Renode testing (see README.md) -- the `wired-split` mode of
  # zmk-west-commands' `west zmk-renode-test`. A wired split pair: the central
  # answers Studio RPC over the emulated USB CDC (tests/renode/renode_test.py),
  # the smoke also asserts a peripheral keypress reaches the central. The
  # renode_usb_wired_split / renode_wired_split shields are local copies (in
  # boards/shields/ here) of zmk-west-commands' test shields of the same name.
  # Emulation-only images (USB/split pinctrl), not flashable as-is.
  #
  - artifact: usb_wired_central
    board: xiao_ble//zmk
    shield: renode_usb_wired_split
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_RUNTIME_TAPDANCE=y -DCONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippets:
      - studio-rpc-usb-uart

  # Plain wired peripheral (no module / no Studio): pairs over the wired link
  # and forwards key events to the central.
  - artifact: usb_wired_peripheral
    board: xiao_ble//zmk
    shield: renode_wired_split
